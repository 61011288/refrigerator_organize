<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="冰箱">
  <title>冰箱</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #4f9cf9;
      --accent-light: rgba(79, 156, 249, 0.1);
      --bg: #ffffff;
      --surface: #f5f5f7;
      --border: #e5e5ea;
      --text: #1c1c1e;
      --muted: #8e8e93;
      --tab-h: 48px;
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }

    html { background: var(--bg); }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── tabs ── */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
      padding-top: var(--safe-top);
      position: relative;
    }

    /* ── sync (cloud) button ── */
    .sync-btn {
      position: absolute;
      right: 12px;
      top: var(--safe-top);
      height: var(--tab-h);
      display: flex;
      align-items: center;
      background: none;
      border: none;
      padding: 0 4px;
      cursor: pointer;
      color: var(--muted);
      -webkit-tap-highlight-color: transparent;
    }
    .sync-btn.ok      { color: var(--accent); }
    .sync-btn.syncing { color: #f0b429; }
    .sync-btn.err     { color: #d93025; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    .sync-btn.syncing svg { animation: pulse 0.9s ease-in-out infinite; }

    .sync-status {
      font-size: 12px;
      color: var(--muted);
      margin: -8px 0 16px;
    }
    .sync-help {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
      margin: 4px 0 16px;
    }
    .sync-help a { color: var(--accent); text-decoration: none; }

    .sub-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
    .sheet hr { border: none; border-top: 1px solid var(--border); margin: 24px 0 18px; }

    .tab {
      flex: 1;
      height: var(--tab-h);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ── panels ── */
    .panel { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .panel.active { display: flex; }

    .item-list {
      flex: 1;
      padding: 8px 16px 80px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
    }

    .empty-state p { font-size: 15px; }

    /* ── category label ── */
    .category-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.4px;
      padding: 10px 2px 2px;
    }

    /* ── food card ── */
    .food-card {
      background: var(--surface);
      border-radius: 12px;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .food-card:active { background: #ebebed; }

    .food-info { flex: 1; min-width: 0; }

    .food-name {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .food-dates {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .days-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .days-badge.ok   { background: var(--accent-light); color: var(--accent); }
    .days-badge.warn { background: rgba(255, 179, 0, 0.12); color: #b37400; }
    .days-badge.bad  { background: rgba(255, 69, 58, 0.1); color: #d93025; }

    /* ── fab ── */
    .fab {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 24px);
      right: 24px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 26px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(79, 156, 249, 0.45);
      -webkit-tap-highlight-color: transparent;
      z-index: 50;
    }

    .fab:active { transform: scale(0.92); }

    /* ── bottom sheet overlay ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      z-index: 100;
      align-items: flex-end;
    }

    .overlay.open { display: flex; }

    /* ── bottom sheet ── */
    .sheet {
      width: 100%;
      background: var(--bg);
      border-radius: 20px 20px 0 0;
      padding: 0 20px calc(var(--safe-bottom) + 24px);
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
      max-height: 90dvh;
      overflow-y: auto;
    }

    .overlay.open .sheet { transform: translateY(0); }

    .sheet-handle {
      width: 36px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 12px auto 20px;
    }

    .sheet h2 {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    /* ── form ── */
    .field { margin-bottom: 16px; }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .field input,
    .field select {
      width: 100%;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 12px;
      font-size: 16px; /* >=16px to stop iOS Safari auto-zoom on focus */
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .field input:focus,
    .field select:focus { border-color: var(--accent); }

    /* shelf life row: auto-filled input + lookup hint */
    .shelf-row { display: flex; align-items: center; gap: 8px; }
    .shelf-row input { flex: 1; }
    .shelf-hint {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }
    .shelf-hint.found   { color: #34a853; }
    .shelf-hint.missing { color: #b37400; }
    .shelf-hint.ai      { color: var(--accent); }

    .field input.needs-input {
      border-color: #f0b429;
      background: rgba(255, 179, 0, 0.04);
    }

    .field input.error { border-color: #d93025; }
    .cat-pills.error .cat-pill:not(.selected) { border-color: #d93025; }

    /* ── category pills ── */
    .cat-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cat-pill {
      height: 34px;
      padding: 0 14px;
      border-radius: 17px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      font-size: 14px;
      font-family: inherit;
      color: var(--muted);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .cat-pill.selected {
      border-color: var(--accent);
      background: var(--accent-light);
      color: var(--accent);
      font-weight: 600;
    }

    /* ── submit button ── */
    .btn-submit {
      width: 100%;
      height: 48px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-submit:active { opacity: 0.85; }
    .btn-submit:disabled { opacity: 0.4; cursor: default; }

    /* ── action sheet buttons ── */
    .action-btn {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 12px;
      background: var(--surface);
      font-size: 16px;
      font-family: inherit;
      color: var(--text);
      cursor: pointer;
      margin-bottom: 8px;
      -webkit-tap-highlight-color: transparent;
    }

    .action-btn:active { opacity: 0.7; }
    .action-btn.eat    { color: #34a853; }
    .action-btn.danger { color: #d93025; }
  </style>
</head>
<body>

<div class="tabs">
  <div class="tab active" data-tab="fridge">冷藏</div>
  <div class="tab" data-tab="freezer">冷冻</div>
  <button class="sync-btn" id="sync-btn" title="云备份" aria-label="云备份">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M19 18H6a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 16.5 8.5a.6.6 0 0 0 .04.2A4 4 0 0 1 19 18z"/></svg>
  </button>
</div>

<div class="panel active" id="panel-fridge">
  <div class="item-list" id="list-fridge"></div>
</div>

<div class="panel" id="panel-freezer">
  <div class="item-list" id="list-freezer"></div>
</div>

<button class="fab" id="fab">＋</button>

<!-- bottom sheet -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <h2>添加食材</h2>

    <div class="field">
      <label>名称</label>
      <input type="text" id="f-name" placeholder="例：鸡蛋、草莓" autocomplete="off">
    </div>

    <div class="field">
      <label>数量（可选，留空不显示）</label>
      <input type="text" id="f-qty" placeholder="例：3" inputmode="numeric">
    </div>

    <div class="field">
      <label>类目</label>
      <div class="cat-pills" id="cat-pills">
        <button class="cat-pill" data-cat="蔬菜">蔬菜</button>
        <button class="cat-pill" data-cat="水果">水果</button>
        <button class="cat-pill" data-cat="肉类">肉类</button>
        <button class="cat-pill" data-cat="鱼虾">鱼虾</button>
        <button class="cat-pill" data-cat="蛋奶">蛋奶</button>
        <button class="cat-pill" data-cat="酱料">酱料</button>
        <button class="cat-pill" data-cat="饮品">饮品</button>
      </div>
    </div>

    <div class="field">
      <label>购买日期</label>
      <input type="date" id="f-date">
    </div>

    <div class="field">
      <label>保质日期（可选，留空则按购买日期 + 天数算）</label>
      <input type="date" id="f-expiry">
    </div>

    <div class="field">
      <label>建议食用（天数）</label>
      <div class="shelf-row">
        <input type="text" id="f-shelf" placeholder="天数" inputmode="numeric">
        <span class="shelf-hint" id="shelf-hint"></span>
      </div>
    </div>

    <button class="btn-submit" id="btn-submit">添加</button>
  </div>
</div>

<!-- action sheet -->
<div class="overlay" id="action-overlay">
  <div class="sheet" id="action-sheet">
    <div class="sheet-handle"></div>
    <h2 id="action-title">操作</h2>
    <button class="action-btn eat" id="act-eat">吃掉了</button>
    <button class="action-btn" id="act-edit">编辑</button>
    <button class="action-btn danger" id="act-delete">删除</button>
  </div>
</div>

<!-- settings sheet -->
<div class="overlay" id="sync-overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>设置</h2>

    <div class="sub-title">云备份（GitHub Gist）</div>

    <div class="field">
      <label>GitHub Token（需 gist 权限）</label>
      <input type="password" id="s-token" placeholder="ghp_… 或 github_pat_…" autocomplete="off">
    </div>

    <p class="sync-help">
      获取方式：打开
      <a href="https://github.com/settings/tokens/new?scopes=gist&description=fridge" target="_blank" rel="noopener">github.com/settings/tokens</a>
      → Generate new token (classic) → 勾选 <b>gist</b> → 生成后复制粘贴到上面。
    </p>

    <p class="sync-status" id="sync-status">未配置</p>

    <button class="btn-submit" id="s-save">保存并同步</button>
    <button class="action-btn" id="s-pull" style="margin-top:10px;">从云端恢复</button>

    <hr>

    <div class="sub-title">AI 估算（DeepSeek 代理）</div>

    <div class="field">
      <label>AI 代理地址（Cloudflare Worker URL）</label>
      <input type="text" id="ai-proxy" placeholder="https://xxx.workers.dev" autocomplete="off" inputmode="url">
    </div>

    <div class="field">
      <label>模型</label>
      <select id="ai-model"></select>
    </div>
    <button class="action-btn" id="ai-fetch" style="margin-bottom:10px;">拉取可用模型</button>

    <p class="sync-help">
      USDA 表里查不到的食材，会自动用 AI 估算建议天数与类目。DeepSeek key 藏在你的
      Cloudflare Worker 里，这里只填 Worker 网址和模型，前端不接触 key。
    </p>

    <p class="sync-status" id="ai-status">AI 未配置</p>

    <button class="btn-submit" id="ai-save">保存</button>
  </div>
</div>

// ─── food table, grouped by category (keyword → fridge days) ────────────────
const FOOD_DB = {

    '果汁': 5, '橙汁': 5, '椰汁': 7, '椰子水': 7, '啤酒': 180,
    '酸梅汤': 5, '柠檬水': 3, '奶茶': 1, '咖啡': 3, '饮料': 30,
  },
};

// Freezer: most items last ~3 months frozen
const FREEZER_DAYS = 90;

// Returns { days, category } for a known food, else null.
// Longest keyword wins, so e.g. "番茄酱" beats "番茄".
function lookupFood(name, location) {
  let best = null;
  for (const cat of Object.keys(FOOD_DB)) {
    const table = FOOD_DB[cat];
    for (const k of Object.keys(table)) {
      if (name.includes(k) && (!best || k.length > best.key.length)) {
        best = { key: k, days: table[k], category: cat };
      }
    }
  }
  if (!best) return null;
  return { days: location === 'freezer' ? FREEZER_DAYS : best.days, category: best.category };
}

// ─── state ───────────────────────────────────────────────────────────────────
const CATEGORIES = ['蔬菜', '水果', '肉类', '鱼虾', '蛋奶', '酱料', '饮品', '其他'];

function loadItems() {
  try { return JSON.parse(localStorage.getItem('fridge_items') || '[]'); } catch { return []; }
}

function saveItems(items) {
  localStorage.setItem('fridge_items', JSON.stringify(items));
  schedulePush();
}

function addItem(item) {
  const items = loadItems();
  items.push(item);
  saveItems(items);
}

function getItem(id) {
  return loadItems().find(i => i.id === id);
}

function deleteItem(id) {
  saveItems(loadItems().filter(i => i.id !== id));
}

// ─── render ──────────────────────────────────────────────────────────────────
const today = () => new Date().toISOString().slice(0, 10);

function daysRemaining(bestUseDate) {
  const diff = Math.ceil((new Date(bestUseDate) - new Date(today())) / 86400000);
  return diff;
}

function badgeClass(days) {
  if (days <= 1) return 'bad';
  if (days <= 4) return 'warn';
  return 'ok';
}

function badgeText(days) {
  if (days <= 0) return '已过期';
  if (days === 1) return '今天';
  return days + '天';
}

function fmt(dateStr) {
  const [, m, d] = dateStr.split('-');
  return m + '/' + d;
}

function renderList(location) {
  const listEl = document.getElementById('list-' + location);
  const items = loadItems().filter(i => i.location === location);

  if (items.length === 0) {
    listEl.innerHTML = '<div class="empty-state"><p>还没有食材</p></div>';
    return;
  }

  // group by category (preserve CATEGORIES order)
  const groups = {};
  CATEGORIES.forEach(c => { groups[c] = []; });
  items.forEach(i => { if (groups[i.category]) groups[i.category].push(i); });

  let html = '';
  CATEGORIES.forEach(cat => {
    if (groups[cat].length === 0) return;
    groups[cat].sort((a, b) => daysRemaining(a.bestUseDate) - daysRemaining(b.bestUseDate));
    html += `<div class="category-label">${cat}</div>`;
    groups[cat].forEach(item => {
      const days = daysRemaining(item.bestUseDate);
      const nameText = item.quantity ? `${item.name} x ${item.quantity}` : item.name;
      const dates = item.explicitExpiry
        ? `建议 ${fmt(item.bestUseDate)}`
        : `购买 ${fmt(item.purchaseDate)} · 建议 ${fmt(item.bestUseDate)}`;
      html += `
        <div class="food-card" data-id="${item.id}">
          <div class="food-info">
            <div class="food-name">${nameText}</div>
            <div class="food-dates">${dates}</div>
          </div>
          <span class="days-badge ${badgeClass(days)}">${badgeText(days)}</span>
        </div>`;
    });
  });

  listEl.innerHTML = html;
}

function renderAll() {
  renderList('fridge');
  renderList('freezer');
}

// ─── tabs ─────────────────────────────────────────────────────────────────────
let activeTab = 'fridge';

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', function () {
    activeTab = this.dataset.tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => { p.classList.remove('active'); p.style.display = 'none'; });
    this.classList.add('active');
    const panel = document.getElementById('panel-' + activeTab);
    panel.classList.add('active');
    panel.style.display = 'flex';
  });
});

// ─── bottom sheet ─────────────────────────────────────────────────────────────
const overlay = document.getElementById('overlay');
const sheet   = document.getElementById('sheet');
const fName   = document.getElementById('f-name');
const fQty    = document.getElementById('f-qty');
const fDate   = document.getElementById('f-date');
const fExpiry = document.getElementById('f-expiry');
const fShelf  = document.getElementById('f-shelf');
const shelfHint = document.getElementById('shelf-hint');
const btnSubmit = document.getElementById('btn-submit');

let selectedCat = null;
let editingId = null;
let catUserSet = false;   // true once the user manually taps a category pill

const PILL_CATS = ['蔬菜', '水果', '肉类', '鱼虾', '蛋奶', '酱料', '饮品'];
function selectCategory(cat) {
  selectedCat = PILL_CATS.includes(cat) ? cat : '其他';
  document.querySelectorAll('.cat-pill').forEach(p =>
    p.classList.toggle('selected', p.dataset.cat === selectedCat)
  );
}

function openSheet(item) {
  editingId = item ? item.id : null;
  document.querySelector('#sheet h2').textContent = item ? '编辑食材' : '添加食材';
  btnSubmit.textContent = item ? '保存' : '添加';

  if (item) {
    fName.value = item.name;
    fQty.value = item.quantity || '';
    fDate.value = item.purchaseDate;
    if (item.explicitExpiry) {
      fExpiry.value = item.bestUseDate;
      fShelf.value = '';
    } else {
      fExpiry.value = '';
      fShelf.value = Math.round(
        (new Date(item.bestUseDate) - new Date(item.purchaseDate)) / 86400000
      );
    }
    selectCategory(item.category);
    catUserSet = true;
  } else {
    fDate.value = today();
    fName.value = '';
    fQty.value = '';
    fExpiry.value = '';
    fShelf.value = '';
    selectedCat = null;
    document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('selected'));
    catUserSet = false;
  }

  shelfHint.textContent = '';
  shelfHint.className = 'shelf-hint';
  fName.classList.remove('error');
  fShelf.classList.remove('error', 'needs-input');
  btnSubmit.disabled = false;
  overlay.classList.add('open');
  if (!item) setTimeout(() => fName.focus(), 320);
}

function closeSheet() {
  overlay.classList.remove('open');
}

document.getElementById('fab').addEventListener('click', () => openSheet());
overlay.addEventListener('click', e => { if (e.target === overlay) closeSheet(); });

// category pills
document.querySelectorAll('.cat-pill').forEach(pill => {
  pill.addEventListener('click', function () {
    catUserSet = true;
    selectCategory(this.dataset.cat);
  });
});

// name → auto shelf lookup (USDA table → AI fallback)
let lookupTimer = null;
let lookupSeq = 0;

function setMissingHint() {
  shelfHint.textContent = '未收录，请手动填写';
  shelfHint.className = 'shelf-hint missing';
  fShelf.classList.add('needs-input');
}

// auto-pick category only if the user hasn't manually chosen one
function autoCategory(cat) {
  if (cat && !catUserSet) selectCategory(cat);
}

async function doLookup() {
  const name = fName.value.trim();
  const seq = ++lookupSeq;
  if (!name) { shelfHint.textContent = ''; shelfHint.className = 'shelf-hint'; return; }

  // 1) local food table (days + category)
  const hit = lookupFood(name, activeTab);
  if (hit) {
    fShelf.value = hit.days;
    autoCategory(hit.category);
    shelfHint.textContent = '✓ 已自动填写';
    shelfHint.className = 'shelf-hint found';
    fShelf.classList.remove('needs-input');
    return;
  }

  // don't override what the user already typed
  if (fShelf.value) return;

  // 2) AI fallback (only if the proxy is configured)
  if (!getProxy()) { setMissingHint(); return; }

  shelfHint.textContent = 'AI 估算中…';
  shelfHint.className = 'shelf-hint ai';
  try {
    const ai = await aiLookup(name, activeTab);
    if (seq !== lookupSeq) return;            // a newer lookup started, ignore
    if (fShelf.value) return;                 // user typed meanwhile
    if (ai.days) {
      fShelf.value = ai.days;
      autoCategory(ai.category);
      shelfHint.textContent = 'AI 估算 ≈ ' + ai.days + ' 天，可手动改';
      shelfHint.className = 'shelf-hint ai';
      fShelf.classList.remove('needs-input');
    } else {
      shelfHint.textContent = 'AI 没查到，请手动填写';
      shelfHint.className = 'shelf-hint missing';
      fShelf.classList.add('needs-input');
    }
  } catch (e) {
    if (seq !== lookupSeq) return;
    shelfHint.textContent = 'AI 查询失败，请手动填写';
    shelfHint.className = 'shelf-hint missing';
    fShelf.classList.add('needs-input');
  }
}
fName.addEventListener('input', () => {
  clearTimeout(lookupTimer);
  lookupTimer = setTimeout(doLookup, 400);
});
fName.addEventListener('blur', doLookup);

fShelf.addEventListener('input', () => {
  fShelf.classList.remove('error', 'needs-input');
  shelfHint.textContent = '';
});

btnSubmit.addEventListener('click', () => {
  // validate & highlight errors
  let ok = true;
  fName.classList.remove('error');
  fShelf.classList.remove('error');
  document.getElementById('cat-pills').classList.remove('error');

  if (!fName.value.trim()) { fName.classList.add('error'); ok = false; }
  // category is optional — defaults to '其他'
  // need either an explicit expiry date OR a positive day count
  const shelfDays = parseInt(fShelf.value, 10);
  if (!fExpiry.value && (!shelfDays || shelfDays <= 0)) { fShelf.classList.add('error'); ok = false; }
  if (!ok) return;

  const purchaseDate = fDate.value;
  const explicitExpiry = !!fExpiry.value;
  const bestUseDate = explicitExpiry
    ? fExpiry.value
    : new Date(new Date(purchaseDate + 'T12:00:00').getTime() + shelfDays * 86400000)
        .toISOString().slice(0, 10);
  const quantity = parseInt(fQty.value, 10) || null;

  if (editingId) {
    const items = loadItems();
    const idx = items.findIndex(i => i.id === editingId);
    if (idx !== -1) {
      items[idx] = {
        ...items[idx],
        name: fName.value.trim(),
        quantity,
        category: selectedCat || '其他',
        purchaseDate,
        bestUseDate,
        explicitExpiry,
      };
      saveItems(items);
    }
  } else {
    addItem({
      id: Date.now().toString(),
      name: fName.value.trim(),
      quantity,
      category: selectedCat || '其他',
      location: activeTab,
      purchaseDate,
      bestUseDate,
      explicitExpiry,
    });
  }

  closeSheet();
  renderAll();
});

// ─── action sheet (edit / delete) ────────────────────────────────────────────
const actionOverlay = document.getElementById('action-overlay');
let actionItemId = null;

function openActionSheet(id) {
  const item = getItem(id);

  actionItemId = id;

document.getElementById('act-eat').addEventListener('click', () => {

['fridge', 'freezer'].forEach(loc => {

    if (card) openActionSheet(card.dataset.id);

// ─── cloud sync (GitHub Gist) ─────────────────────────────────────────────────
const TOKEN_KEY = 'gh_token';
const GIST_KEY  = 'gist_id';
const GIST_FILE = 'fridge.json';
const syncBtn    = document.getElementById('sync-btn');
const syncOverlay = document.getElementById('sync-overlay');
const syncStatus = document.getElementById('sync-status');
let pushTimer = null;

const getToken  = () => localStorage.getItem(TOKEN_KEY) || '';
const getGistId = () => localStorage.getItem(GIST_KEY) || '';

function setSync(state, text) {
  syncBtn.className = 'sync-btn' + (state ? ' ' + state : '');
  if (text) syncStatus.textContent = text;
}

function syncTime() {
  const t = localStorage.getItem('last_sync');
  return t ? new Date(t).toLocaleString('zh-CN', { hour12: false }) : '';
}

function ghFetch(url, opts = {}) {
  return fetch(url, {
    ...opts,
    headers: {
      'Authorization': 'Bearer ' + getToken(),
      'Accept': 'application/vnd.github+json',
      ...(opts.headers || {}),
    },
  });
}

async function pushToGist() {
  if (!getToken()) return;
  setSync('syncing', '同步中…');
  const content = localStorage.getItem('fridge_items') || '[]';
  const body = JSON.stringify({
    description: '冰箱食材备份',
    public: false,
    files: { [GIST_FILE]: { content } },
  });
  try {
    let gistId = getGistId(), res;
    if (gistId) {
      res = await ghFetch('https://api.github.com/gists/' + gistId, { method: 'PATCH', body });
      if (res.status === 404) gistId = '';   // gist deleted → recreate
    }
    if (!gistId) {
      res = await ghFetch('https://api.github.com/gists', { method: 'POST', body });
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.id) localStorage.setItem(GIST_KEY, data.id);
    localStorage.setItem('last_sync', new Date().toISOString());
    setSync('ok', '已同步 · ' + syncTime());
  } catch (e) {
    setSync('err', '同步失败：' + e.message);
  }
}

async function pullFromGist() {
  if (!getToken() || !getGistId()) return;
  setSync('syncing', '同步中…');
  try {
    const res = await ghFetch('https://api.github.com/gists/' + getGistId());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const file = data.files && data.files[GIST_FILE];
    if (file && file.content) {
      localStorage.setItem('fridge_items', file.content);   // no schedulePush (direct write)
      renderAll();
    }
    localStorage.setItem('last_sync', new Date().toISOString());
    setSync('ok', '已同步 · ' + syncTime());
  } catch (e) {
    setSync('err', '恢复失败：' + e.message);
  }
}

function schedulePush() {
  if (!getToken()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushToGist, 800);
}

// ─── AI fallback (via Cloudflare Worker proxy holding the DeepSeek key) ────────
const AI_PROXY = 'ai_proxy';
const AI_MODEL = 'ai_model';
const DEFAULT_PROXY = 'https://fridge-ai.dnzzz.workers.dev';
const DEFAULT_MODEL = 'deepseek-v4-flash';
const aiStatus = document.getElementById('ai-status');
const getProxy = () => (localStorage.getItem(AI_PROXY) || DEFAULT_PROXY).trim();
const getModel = () => localStorage.getItem(AI_MODEL) || DEFAULT_MODEL;

function setModelOptions(models, selected) {
  const sel = document.getElementById('ai-model');
  const list = (models && models.length) ? models.slice() : [];
  if (selected && !list.includes(selected)) list.unshift(selected);
  if (!list.length) list.push(DEFAULT_MODEL);
  sel.innerHTML = '';
  list.forEach(m => {
    const o = document.createElement('option');
    o.value = m; o.textContent = m;
    if (m === selected) o.selected = true;
    sel.appendChild(o);
  });
}

async function aiLookup(name, location) {
  const res = await fetch(getProxy(), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, location, model: getModel() }),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  const n = parseInt(data.days, 10);
  return { days: n > 0 ? n : null, category: data.category || null };
}

// open / close settings
syncBtn.addEventListener('click', () => {
  document.getElementById('s-token').value = getToken();
  if (!getToken()) setSync('', '未配置');
  else syncStatus.textContent = syncTime() ? '已同步 · ' + syncTime() : '已配置';
  document.getElementById('ai-proxy').value = getProxy();
  setModelOptions([], getModel());
  aiStatus.textContent = getProxy() ? 'AI 已启用（' + getModel() + '）' : 'AI 未配置';
  syncOverlay.classList.add('open');
});
syncOverlay.addEventListener('click', e => { if (e.target === syncOverlay) syncOverlay.classList.remove('open'); });

document.getElementById('s-save').addEventListener('click', async () => {
  const t = document.getElementById('s-token').value.trim();
  if (t) localStorage.setItem(TOKEN_KEY, t);
  else { localStorage.removeItem(TOKEN_KEY); setSync('', '未配置'); return; }
  await pushToGist();
});

document.getElementById('s-pull').addEventListener('click', pullFromGist);

document.getElementById('ai-save').addEventListener('click', () => {
  const u = document.getElementById('ai-proxy').value.trim();
  const m = document.getElementById('ai-model').value || DEFAULT_MODEL;
  localStorage.setItem(AI_MODEL, m);
  if (u) { localStorage.setItem(AI_PROXY, u); aiStatus.textContent = 'AI 已启用（' + m + '）'; }
  else { localStorage.removeItem(AI_PROXY); aiStatus.textContent = 'AI 未配置'; }
});

document.getElementById('ai-fetch').addEventListener('click', async () => {
  aiStatus.textContent = '拉取模型中…';
  try {
    const res = await fetch(getProxy(), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'models' }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.models && data.models.length) {
      setModelOptions(data.models, getModel());
      aiStatus.textContent = '拉取到 ' + data.models.length + ' 个模型，选好后点保存';
    } else {
      aiStatus.textContent = '没拉到模型：' + (data.error || '空列表');
    }
  } catch (e) {
    aiStatus.textContent = '拉取失败：' + e.message;
  }
});

// ─── init ─────────────────────────────────────────────────────────────────────
renderAll();

if (getToken()) {
  setSync('ok', '已同步 · ' + (syncTime() || '…'));
  if (getGistId()) pullFromGist();   // restore latest from cloud on open
} else {
  setSync('', '未配置');
}
</script>
